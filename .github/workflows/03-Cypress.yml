name: 03-Cypress

on:
  workflow_run:
    workflows:
      - 02-SonarCloud
    types:
      - completed

jobs:
  cypress:
    name: Cypress E2E
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4280/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose ps
          exit 1

      - name: Run Cypress E2E (full)
        working-directory: frontend
        run: npx cypress run --config baseUrl=http://localhost:4280

      - name: Docker Compose status (on failure)
        if: failure()
        run: docker compose ps

      - name: Docker Compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Cypress artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
