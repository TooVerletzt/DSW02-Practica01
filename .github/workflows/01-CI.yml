name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend test phase
        working-directory: backend
        run: mvn -B test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run isolated Cypress UI spec
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: frontend
          start: npm run start -- --host 127.0.0.1 --port 4200
          wait-on: http://127.0.0.1:4200/login
          wait-on-timeout: 120
          spec: cypress/e2e/login-ui-ci.cy.ts
          config: baseUrl=http://127.0.0.1:4200,video=false,screenshotOnRunFailure=true
